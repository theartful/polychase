schema_version = "1.0.0"

id = "polychase"
version = "0.0.14"
name = "Polychase"
tagline = "Mesh Based Motion Tracking in Blender"
maintainer = "Ahmed Essam"
type = "add-on"
website = "https://github.com/theartful/polychase"
tags = ["Animation", "Tracking"]
blender_version_min = "4.2.0"
license = ["SPDX:GPL-3.0-or-later"]
platforms = ["windows-x64", "linux-x64", "macos-arm64"]
wheels = [
    "./wheels/polychase_core-0.0.3-cp311-cp311-manylinux_2_28_x86_64.whl",
    "./wheels/polychase_core-0.0.3-cp313-cp313-manylinux_2_28_x86_64.whl",
    "./wheels/polychase_core-0.0.3-cp311-cp311-win_amd64.whl",
    "./wheels/polychase_core-0.0.3-cp313-cp313-win_amd64.whl",
    "./wheels/polychase_core-0.0.3-cp311-cp311-macosx_11_0_arm64.whl",
    "./wheels/polychase_core-0.0.3-cp313-cp313-macosx_11_0_arm64.whl",
]

[permissions]
files = "Write optical flow database to disk"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  ".*",
  "*.zip",
  "lib/",
]
